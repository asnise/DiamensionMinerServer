    jdbcUrl: "jdbc:postgresql://localhost:5432/dimensional_game"
    username: "postgres"
    password: "123456"

  cloud:
    jdbcUrl: "jdbc:postgresql://ep-broad-dream-b32si870-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/dimensional_game?sslmode=require"
    username: "neondb_owner"
    password: "CHANGE_ME"

# UI resource pack (crafting/forge screens). Built from the jar's pack/ folder
# (tools/resourcepack/generate.mjs) and served by the plugin itself.
resource_pack:
  enabled: true
  port: 8085
  # What clients download from. Empty = http://localhost:<port>/pack.zip (local testing only);
  # set a reachable address for remote players, e.g. "http://play.example.com:8085/pack.zip".
  public_url: ""
  required: false

craft:
  # Energy per craft when a Recipe has no energy_cost.
  default_energy: 5
  # Forge Heat mini-game (FORGE button in the craft window, gear outputs only). Turn-based: fill
  # Progress before Integrity runs out; Quality at the end sets the grade (forge.quality_bp).
  # Failing / stopping / closing still crafts the item at Normal.
  minigame:
    enabled: true
    progress_goal: 100
    integrity: 70
    focus: 50
    fine_at: 50
    masterwork_at: 95
    integrity_cost: 10          # per action (x unstable_cost_bp when the furnace is Unstable)
    hammer_progress: 25
    fold_quality: 15
    temper_quality: 30
    temper_focus: 20
    quench_integrity: 20
    quench_focus: 15
    rush_progress: 60
    rush_chance_bp: 5000        # 50%
    heat_weights: { NORMAL: 55, HOT: 25, WHITE_HOT: 8, UNSTABLE: 12 }
    hot_quality_bp: 15000       # quality gains x1.5
    white_hot_quality_bp: 25000 # x2.5
    unstable_cost_bp: 15000     # integrity cost x1.5

forge:
  quote_seconds: 60
  # Used by Advancement/Refine when an ItemBase has no upgrade_material.
  default_upgrade_material: prim_metal
  # Growth per Advancement level = base stat x ratio, when an ItemBase has no growth_stats.
  default_growth_ratio: 0.02
  # Refine bonus by level 0..10 (basis points: 1000 = +10%).
  refine_bonus_bp: [0, 300, 600, 1000, 1400, 1900, 2500, 3200, 4000, 5000, 6000]
  # Success chance to go +n -> +n+1, n = 0..9 (basis points).
  refine_chance_bp: [10000, 9000, 8000, 7000, 6000, 5000, 4000, 3000, 2000, 1000]
  # Failures at +n after which the next attempt always succeeds (0 = no pity), n = 0..9.
  refine_pity: [0, 2, 3, 4, 5, 6, 7, 8, 10, 12]
  # cost(level) = floor(base + per_level x level)
  advancement: { energy_base: 2, energy_per_level: 0.1, material_base: 1, material_per_level: 0.04 }
  refine: { energy_base: 10, energy_per_level: 10, material_base: 2, material_per_level: 1 }
  # Crafted grade multiplies Base stats (basis points). FINE / MASTERWORK come from the Forge Heat mini-game.
  quality_bp: { NORMAL: 10000, FINE: 10300, MASTERWORK: 10600 }
  # Engrave: up to 3 fragments per gear piece (ItemBase with an "engrave" block). Removing one uses
  # 1x remover_item and returns the fragment. An exclusive affix can be on a piece only once.
  engrave: { energy: 20, remove_energy: 10, remover_item: engrave_solvent }
  # Inheritance: move ONE of Advancement / Refine / Engrave to a piece of the same category; source destroyed.
  inherit: { energy: 50 }
  # Durability: gear without "durability" in its ItemBase gets default_max. At 0 the piece is not
  # destroyed; it keeps only Base stats until repaired. Weapon -1 per hit landed, armor -1 per piece
  # per hit taken, gear pickaxe -1 per node mined; vanilla wear is cancelled.
  durability: { default_max: 250 }
  # Repair to full: at the forge for Energy, or at a Blacksmith NPC (/forge npc add) for COIN.
  repair: { energy_per_point: 0.2, coin_per_point: 1 }

# Combat pipeline (player <-> mob, melee + projectiles). Environmental damage and mob-vs-mob stay vanilla.
# Damage = Raw x crit x K / (K + Defense). Vanilla armor and protection enchants are ignored.
# Raw: gear ATK x attack charge (players) / mob attack (mobs). Non-gear weapons use vanilla damage.
combat:
  enabled: true
  defense_k: 50
  unarmed_attack: 1
  player_base_defense: 0
  crit_multiplier: 1.5
  sweep_ratio: 0.25
  # PvP outside PvP zones (/zone create <name> pvp). Safe zones never allow combat.
  pvp: false
  damage_indicators: true
  # Mob attack follows the world difficulty like vanilla: Easy = min(a/2+1, a), Normal = a, Hard = a x 1.5.
  scale_by_difficulty: true
  # Unique Effects / set effects: LIFESTEAL heals at most this much HP per hit.
  effects: { lifesteal_cap: 4 }
  # Death outside a dungeon: nothing is lost except durability of equipped gear; respawn at the hub.
  death: { durability_loss_percent: 10, respawn_world: overworld_t0 }
  # hp is optional (omit = vanilla max health). Dungeon SUMMON actions can override with "stats".
  mobs:
    default: { attack: 3, defense: 0 }
    ZOMBIE: { hp: 20, attack: 3, defense: 2 }
    HUSK: { hp: 22, attack: 3, defense: 2 }
    DROWNED: { hp: 20, attack: 3, defense: 2 }
    SKELETON: { hp: 18, attack: 3, defense: 0 }
    STRAY: { hp: 18, attack: 3, defense: 1 }
    SPIDER: { hp: 16, attack: 2, defense: 0 }
    CAVE_SPIDER: { hp: 12, attack: 2, defense: 0 }
    CREEPER: { hp: 20, attack: 0, defense: 0 }
    WITHER_SKELETON: { hp: 30, attack: 6, defense: 5 }
    PIGLIN_BRUTE: { hp: 40, attack: 8, defense: 6 }

# Energy from vanilla EXP (9.3) and Server Level / Core (9.4). Two separate ledgers: ENERGY and SERVER_XP.
# EXP orbs become Energy; the vanilla XP bar shows the Energy balance; enchanting/anvil/grindstone and
# Mending are off. Server Level unlocks content and never adds damage.
progression:
  energy_per_xp: 1
  server_level:
    # XP from level n to n+1 = base x n^growth
    base: 100
    growth: 1.5
    max: 100
  server_xp:
    mine_default: 5          # per node; override per ore: mine: { ore_prim_metal: 8 }
    mine: {}
    kill_default: 1          # per mob; override per type: kill: { zombie: 2 }
    kill: {}
    kill_cap_per_hour: 300   # anti-farm
    craft_energy_per_xp: 10  # crafting / forging: 1 Server XP per 10 Energy spent
    dungeon_clear: 100       # when the dungeon's final_rewards has no SERVER_XP

# Tiers (1.1 / 1.2). Tier 0 is the hub (overworld_t0). Tier k: "map" is a folder (path from the server
# folder) with the map: a dimension folder (has region/) or a level folder (dimensions/minecraft/overworld).
# It is copied once into the hub level as overworld_tk, then channels 2..N are cloned from it.
# (Delete overworld_t0/dimensions/minecraft/overworld_tk* to re-copy after changing the map.)
# Unlock = server_level AND every flag (player_unlocks): clear:<dungeon_id> is granted by clearing that
# dungeon; quest:<id> is granted with /tier grant until the quest system exists.
channels:
  per_tier: 3
  max_per_tier: 9          # extra channels open when every open one is full
  max_players: 50          # per channel (admins may exceed)
  extra_idle_minutes: 10   # an extra channel closes after this long empty
tiers:
  1:
    name: "Tier 1"
    map: "../Map/OverWorld_t1"
    icon: IRON_PICKAXE
    server_level: 2
    flags: ["clear:dungeon_test_training"]
# Warp (1.4): prepare without moving or taking damage, then a cooldown.
warp:
  prepare_seconds: 5
  cooldown_seconds: 30

# Economy (Task.md 8.3 / 8.4 / 8.5)
economy:
  market:
    tax_basis_points: 500       # 5% of the price, taken from the seller (floor)
    listing_hours: 48
    max_listings_per_player: 10
    min_price: 1
    max_price: 10000000
  buyback:                      # Market Clerk buys these for COIN (capped COIN source)
    daily_coin_cap: 500         # per account per day
    prices:
      prim_metal: 4
      raw_iron: 2
      coal: 1
  trade:
    max_distance: 8             # blocks; both players must be in a Safe Zone

# Workspaces (Task.md 8.1 / 8.2)
workspace:
  template: ws_template          # world folder in the server root; missing = a flat world
  unload_after_seconds: 60
  # Offsets "x,y,z" from the world spawn (standing level). One station per pad.
  pads: ["3,0,-2", "3,0,0", "3,0,2", "5,0,-2", "5,0,0", "5,0,2"]
  stash_offset: "-3,0,0"
  stations:                      # TYPE (ProcessingRecipe.station) -> block
    SMELTER: BLAST_FURNACE
    PRESS: SMITHING_TABLE
    REFINERY: BREWING_STAND
