name: EXeaEntityCore
version: '${version}'
main: com.exea.entity.EXeaEntityPlugin
api-version: '1.21'
author: EXea
website: https://github.com/asnise/EXeaEntityCore
description: Animated Blockbench models on Paper, drawn with ItemDisplay bones, with an API for other plugins.
commands:
  exea:
    description: Master administrative command for EXeaEntityCore
    aliases: [ex]
    permission: exea.admin
permissions:
  exea.admin:
    description: Full administrative control over EXeaEntityCore
    default: op
