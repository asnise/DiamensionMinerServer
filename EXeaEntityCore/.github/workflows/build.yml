name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin and API jars
        run: |
          chmod +x gradlew
          ./gradlew jar apiJar apiSourcesJar -PoutDir=build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: EXeaEntityCore
          path: build/libs/*.jar
          if-no-files-found: error
